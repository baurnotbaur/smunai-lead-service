<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Заявки — отдел продаж</title>
<link rel="stylesheet" href="/style.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%234f7cff'/><path d='M9 16h14M9 11h14M9 21h9' stroke='white' stroke-width='2.4' stroke-linecap='round'/></svg>">
<script>
  const t = localStorage.getItem('theme') || 'dark';
  document.documentElement.setAttribute('data-theme', t);
</script>
</head>
<body>

<!-- ЭКРАН ВХОДА -->
<div class="login" id="loginScreen" hidden>
  <form class="login__box card" id="loginForm">
    <div class="login__logo">Заявки</div>
    <p class="muted" style="margin-top:0">Панель отдела продаж</p>
    <label class="field">
      <span>Email</span>
      <input type="email" name="email" autocomplete="username" required>
    </label>
    <label class="field">
      <div style="display:flex; justify-content:space-between; align-items:center;">
        <span>Пароль</span>
        <a href="#" id="forgotBtn" style="font-size:12px; color:var(--blue); text-decoration:none;">Забыли пароль?</a>
      </div>
      <input type="password" name="password" autocomplete="current-password" required>
    </label>
    <button class="btn btn--primary" style="width:100%" type="submit">Войти</button>
    <p class="muted" id="loginError" style="color:var(--red);min-height:20px;margin:10px 0 0;font-size:13px"></p>
  </form>

  <form class="login__box card" id="forgotForm" hidden>
    <div class="login__logo">Сброс</div>
    <p class="muted" style="margin-top:0">Получить ссылку в Telegram</p>
    <label class="field">
      <span>Email</span>
      <input type="email" name="email" required>
    </label>
    <button class="btn btn--primary" style="width:100%" type="submit">Отправить ссылку</button>
    <a href="#" id="backToLoginBtn" style="display:block; text-align:center; margin-top:15px; font-size:13px; color:var(--muted);">Вернуться</a>
    <p class="muted" id="forgotError" style="color:var(--red);min-height:20px;margin:10px 0 0;font-size:13px"></p>
  </form>

  <form class="login__box card" id="resetForm" hidden>
    <div class="login__logo">Новый пароль</div>
    <p class="muted" style="margin-top:0">Придумайте новый пароль</p>
    <label class="field">
      <span>Новый пароль (мин. 8 символов)</span>
      <input type="password" name="newPassword" minlength="8" required>
    </label>
    <button class="btn btn--primary" style="width:100%" type="submit">Сохранить пароль</button>
    <p class="muted" id="resetError" style="color:var(--red);min-height:20px;margin:10px 0 0;font-size:13px"></p>
  </form>
</div>

<!-- ПАНЕЛЬ -->
<div class="layout" id="app" hidden>
  <aside class="sidebar">
    <div class="sidebar__brand"><span class="sidebar__dot"></span> Заявки</div>
    <a class="nav-link" href="#/leads" data-nav="leads">
      Все заявки <span class="badge-count" id="navNew" hidden></span>
    </a>
    <a class="nav-link" href="#/tasks" data-nav="tasks">
      Дела <span class="badge-count" id="navTasks" hidden></span>
    </a>
    <a class="nav-link" href="#/board" data-nav="board">Доска</a>
    <a class="nav-link" href="#/companies" data-nav="companies">Компании</a>
    <a class="nav-link" href="#/marketing" data-nav="marketing">Маркетинг</a>
    <a class="nav-link" href="#/stats" data-nav="stats">Аналитика</a>
    <a class="nav-link" href="#/stages" data-nav="stages">Воронка</a>
    <a class="nav-link" href="#/sites" data-nav="sites">Подключение сайта</a>
    <a class="nav-link" href="#/bot" data-nav="bot">Бот</a>
    <a class="nav-link" href="#/team" data-nav="team">Сотрудники</a>
    <div class="sidebar__spacer"></div>
    <div class="sidebar__user">
      <div id="userName" style="font-weight:500"></div>
      <div class="muted" id="userRole" style="font-size:12px;margin-bottom:8px"></div>
      <div style="display:flex; gap:6px;">
        <button class="btn btn--ghost btn--sm" id="themeToggleBtn" style="padding: 5px 8px; font-size:14px;">☀️</button>
        <button class="btn btn--ghost btn--sm" id="logoutBtn" style="flex:1">Выйти</button>
      </div>
    </div>
  </aside>

  <main class="content" id="view"></main>
</div>

<div class="toast" id="toast"></div>
<script src="/app.js"></script>
</body>
</html>
